name: Build AliReturnHelper APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          unzip -q AliReturnHelper_v0.25_popup_priority_source.zip
          cd v24src
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AliReturnHelper-debug-apk
          path: v24src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
